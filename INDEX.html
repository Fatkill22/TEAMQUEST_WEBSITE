<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">  
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E-LEARNING WEBSITE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body { background-color: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { width: 100%; max-width: 400px; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
</style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">TeamQuest Training</h2>
        <p class="text-muted">Please log in</p>
    </div>

    <form action="INDEX.php" method="POST" autocomplete="off">
        <div class="mb-3">
            <label class="form-label fw-semibold">Username</label>
            <input type="text" name="username" class="form-control" placeholder="Username" required autocomplete="off">
        </div>
        
        <div class="mb-4">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" name="password" class="form-control" placeholder="Password" required autocomplete="new-password">
        </div>

        <button type="submit" name="login" class="btn btn-primary w-100 py-2 fw-bold">LOGIN</button>
    </form>

    <hr>
    <a href="REGISTER.html" class="btn btn-secondary w-100 py-2 fw-bold">REGISTER</a>
</div>

</body>
</html>
