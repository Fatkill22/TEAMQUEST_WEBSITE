<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — TeamQuest Training Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<div class="tq-login-page">

  <!-- LEFT — Navy brand panel -->
  <div class="tq-login-left">
    <div class="tq-login-bg" style="background-image: url('Images/TeamQuest.jpg');"></div>
    <div class="tq-login-logo-wrap">
      <img src="Images/Logo.png" alt="TeamQuest Technology Inc.">
      <p style="color: rgba(255,255,255,0.6); font-size: 13px; margin: 0; text-align: center;">
        Training &amp; Development Portal
      </p>
    </div>
  </div>

  <!-- RIGHT — Register form -->
  <div class="tq-login-right" style="width: 520px;">
    <div class="tq-login-form-wrap">

      <div class="tq-login-title">Create Account</div>
      <div class="tq-login-sub">Fill in your details to register.</div>

      <form action="REGISTER.php" method="POST">

        <div class="tq-form-row">
          <div class="tq-form-group" style="margin-bottom:0;">
            <label class="tq-label">First Name</label>
            <input type="text" id="firstname" name="firstname" class="tq-input" placeholder="First name" required>
          </div>
          <div class="tq-form-group" style="margin-bottom:0;">
            <label class="tq-label">Last Name</label>
            <input type="text" id="lastname" name="lastname" class="tq-input" placeholder="Last name" required>
          </div>
        </div>
        <p style="font-size: 12px; color: var(--tq-muted); margin: 6px 0 14px;">
          <i class="bi bi-info-circle me-1"></i>Username will be First Name + Last Name (e.g. juandela)
        </p>

        <div class="tq-form-group">
          <label class="tq-label"><i class="bi bi-credit-card me-1"></i>Employee Number</label>
          <input type="text" id="empnumber" name="empnumber" class="tq-input" placeholder="Your employee number (this will be your password)" required>
        </div>

        <div class="tq-form-row">
          <div class="tq-form-group" style="margin-bottom:0;">
            <label class="tq-label"><i class="bi bi-building me-1"></i>Department</label>
            <select id="department" name="department" class="tq-select" required>
              <option value="" disabled selected>-- Select --</option>
              <option value="ACCOUNTING">ACCOUNTING</option>
              <option value="ASEPH BURN-IN">ASEPH BURN-IN</option>
              <option value="CML BURN-IN">CML BURN-IN</option>
              <option value="ENGINEERING">ENGINEERING</option>
              <option value="HR/ADMIN">HR/ADMIN</option>
              <option value="LOGISTICS">LOGISTICS</option>
              <option value="MACHINING">MACHINING</option>
              <option value="MARKETING">MARKETING/SALES</option>
              <option value="MIS">MIS</option>
              <option value="PLANNING">PLANNING</option>
              <option value="PRODUCTION">PRODUCTION</option>
              <option value="PURCHASING">PURCHASING</option>
              <option value="QA">QA</option>
              <option value="QA/TRAINING">QA/TRAINING</option>
              <option value="STOR">STORE</option>
              <option value="WAREHOUSE">WAREHOUSE</option>
            </select>
          </div>
          <div class="tq-form-group" style="margin-bottom:0;">
            <label class="tq-label"><i class="bi bi-person-badge me-1"></i>Position</label>
            <input type="text" id="position" name="position" class="tq-input" placeholder="Your job title" required>
          </div>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 24px;">
          <a href="INDEX.html" class="btn-tq-outline" style="flex: 1; justify-content: center; height: 46px; font-size: 14px;">
            <i class="bi bi-arrow-left"></i> Back
          </a>
          <button type="submit" class="btn-tq-primary" style="flex: 2; justify-content: center; height: 46px; font-size: 15px;">
            <i class="bi bi-person-plus"></i> Register
          </button>
        </div>

      </form>

    </div>
  </div>

</div>

<script src="assets/js/scripts.js"></script>
</body>
</html>
