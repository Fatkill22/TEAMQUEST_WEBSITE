<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        
        body {
            background-image: url('Images/TeamQuest.jpg');
            background-size: cover;    
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-card {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .register-card h2 {
            text-align: center;
            margin-bottom: 1rem;
            color: #0d6efd;
        }

        
    </style>
</head>
<body>

<div class="register-card">
    <h2>TeamQuest Registration</h2>
    <form action="REGISTER.php" method="POST">

       
        <div class="mb-3">
            <label for="firstname" class="form-label">First Name</label>
            <input type="text" id="firstname" name="firstname" class="form-control" required>
        </div>

        <div class="mb-3">
            <label for="lastname" class="form-label">Last Name</label>
            <input type="text" id="lastname" name="lastname" class="form-control" required>
        </div>
        <small class="text-muted mb-3 d-block">Username will be First Name + Last Name</small>

        
        <div class="mb-3">
            <label for="empnumber" class="form-label">Employee Number</label>
            <input type="text" id="empnumber" name="empnumber" class="form-control" required>
            <small class="text-muted">Employee Number will be your password</small>
        </div>

        <div class="mb-3">
            <label for="department" class="form-label">Department</label>
            <select id="department" name="department" class="form-select" required>
                <option value="" disabled selected>-- Select Department --</option>
                <option value="ACCOUNTING">ACCOUNTING</option>
                <option value="ASEPH BURN-IN">ASEPH BURN-IN</option>
                <option value="CML BURN-IN">CML BURN-IN</option>
                <option value="ENGINEERING">ENGINEERING</option>
                <option value="HR/ADMIN">HR/ADMIN</option>
                <option value="LOGISTICS">LOGISTICS</option>
                <option value="MACHINING">MACHINING</option>
                <option value="MARKETING">MARKETING/SALES</option>
                <option value="MIS">MIS</option>
                <option value="PLANNING">PLANNING</option>
                <option value="PRODUCTION">PRODUCTION</option>
                <option value="PURCHASING">PURCHASING</option>
                <option value="QA">QA</option>
                <option value="QA/TRAINING">QA/TRAINING</option>
                <option value="STOR">STORE</option>
                <option value="WAREHOUSE">WAREHOUSE</option>

            </select>
        </div>

        <div class="mb-3">
            <label for="position" class="form-label">Position</label>
            <input type="text" id="position" name="position" class="form-control" placeholder="Enter your position" required>
        </div>

  
        <div class="d-flex justify-content-between mt-4">
            <a href="INDEX.html" class="btn btn-secondary">Back</a>
            <button type="submit" class="btn btn-primary">Register</button>
        </div>

    </form>
</div>

</body>
</html>
