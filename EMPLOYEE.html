<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Online Training</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
    <div>
        <div class="logo">
            <img src="Images/Logo.png" alt="Company Logo">
        </div>
        

        <ul class="nav nav-tabs" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">Home</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="profile-tab" data-bs-toggle="tab" data-bs-target="#profile-tab-pane" type="button" role="tab" aria-controls="profile-tab-pane" aria-selected="false">Modules</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact-tab-pane" type="button" role="tab" aria-controls="contact-tab-pane" aria-selected="false">Performance Report</button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="disabled-tab" data-bs-toggle="tab" data-bs-target="#disabled-tab-pane" type="button" role="tab" aria-controls="disabled-tab-pane" aria-selected="false" disabled>Disabled</button>
            </li>
          </ul>
          <div class="tab-content" id="myTabContent">
            <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
                <div class="Homepage-Tab">
                    <div class="Homepage-button-tab"> 
                        <button type="button" class="btn btn-primary" >Start Online Training</button>
                    </div>
                </div>
            </div>


            <div class="tab-pane fade" id="profile-tab-pane" role="tabpanel" aria-labelledby="Module-tab" tabindex="0">
               <br>
                <div class="container">
                    <div class="row">
                        
                        <div class="col-md-6 mb-4">
                            <div class="module-card" style="cursor: pointer;" onclick="window.location.href='Module1.html'">
                                <img src="Images/Module1.jpg" alt="Module 1" class="img-fluid">
                                <div class="module-description">
                                    <h4>Semiconductor Burn-In Training Module</h4>
                                    <p>This is the description of module 1. It explains the features and content.</p>
                                </div>
                            </div>
                        </div>
                        <!-- Module 2 -->
                        <div class="col-md-6 mb-4">
                            <div class="module-card" style="cursor: pointer;" onclick="window.location.href='#'">
                                <img src="Images/Module2.jpg" alt="Module 2" class="img-fluid">
                                <div class="module-description">
                                    <h4>Inspection and Sorting Training</h4>
                                    <p>This is the description of module 2. It covers advanced topics.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            

            </div>




            <div class="tab-pane fade" id="contact-tab-pane" role="tabpanel" aria-labelledby="contact-tab" tabindex="0">...</div>
            <div class="tab-pane fade" id="disabled-tab-pane" role="tabpanel" aria-labelledby="disabled-tab" tabindex="0">...</div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>



<style>
    .logo img {
        height: 70px;
        width: auto;  
    }

    .logo {
        background-color: blue;
    }

    .Homepage-Tab {
    background-image: url("Images/TeamQuest.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    min-height: 800px;
    display: flex;
    justify-content: center;
    align-items: center;
    }

    .Homepage-button-tab .btn {
    font-size: 28px;
    padding: 20px 60px;
    } 
    .module-card {
        border: 2px solid rgb(0, 0, 0);
        border-radius: 10px;
        overflow: hidden;
        text-align: center;
        background-color: #f9f9f9;
        transition: transform 0.3s;
    }

    .module-card img {
        width: 100%;         
        height: 250px;        
        object-fit: cover;   
    }
